---
- name: RHEL package management tests
  hosts: all
  become: true 

  tasks:
    - name: dnf update latest packages
      org.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: install apache2
      org.builtin.dnf:
        name: httpd
        state: present

    - name: create index html
      org.builtin.html:
        dest: /var/www/html/index.html
        content: "<h1>Apache2 is running in RHEL SO!</h1>"
        mode: '0644'

    - name: start and enable httpd service
      org.builtin.systemd:
        name: httpd
        state: started
        enabled: true
